<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>
<body>
    <form method="post">
        Eng: <input type="checkbox" name="lang" value="English" class="lang">
        Hindi: <input type="checkbox" name="lang" value="hindi" class="lang">
        Marathi: <input type="checkbox" name="lang" value="marathi" class="lang">
        <input type="submit" value="submit" id="sub">
    </form>
</body>
</html>

<script>
    document.getElementById('sub').addEventListener('click', function (e) {
        e.preventDefault();
        const lan = document.querySelectorAll('input[type="checkbox"]');
        lan.forEach(item => {
            if(item.checked){
                console.log(item.value);
            }
        });
    });
</script>
